# SPDX-License-Identifier: MIT
# BulkXfer server peripheral - throughput-oriented baseline for nRF54 + NCS.

CONFIG_LOG=y
CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BulkXfer"
CONFIG_BT_MAX_CONN=1
# Lets the server start the ATT MTU exchange itself (clients usually do too).
# The BulkXfer Client role is compiled out in CMakeLists.txt.
CONFIG_BT_GATT_CLIENT=y

# ATT_MTU 247 -> 244-byte write payload = one 251-byte LL packet.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Link tuning requested by gv_BLKS_OnConnected() (b_autoTuneLink = true).
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y

# Enough host/controller buffers to fill each connection event.
# BulkXfer's in-flight credits must stay below BT_ATT_TX_COUNT (build-checked).
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
# Must exceed BT_BUF_ACL_TX_COUNT (one completion event per ACL buffer).
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_ATT_PREPARE_COUNT=0

# Let the SoftDevice Controller extend connection events for many packets.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=4000000

# Preferred connection interval 7.5-15 ms (units of 1.25 ms).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
